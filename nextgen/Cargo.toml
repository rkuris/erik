[package]
name = "pool-controller-nextgen"
version = "0.1.0"
authors = ["Ron Kuris <swcafe@gmail.com>", "Erik" ]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "pool-controller"
harness = false
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = "fat"
# IMPORTANT: Do not strip here. Unstripped ELF is needed for flashing & espflash app descriptor detection.
# A separate post-build strip step (scripts/size-report.sh) can produce a stripped artifact for size audits.
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]
weak-derivation = []

[dependencies]
anyhow = "1.0"
esp-idf-hal = { version = "0.45.2" }
esp-idf-svc = { version = "0.51", features = ["embassy-sync"] }
log = "0.4"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["std", "formatting"] }
pbkdf2 = "0.12"
rand = { version = "0.8", default-features = false, features = ["std"] }
subtle = "2.5"
heapless = "0.8"

[build-dependencies]
embuild = "0.33"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
